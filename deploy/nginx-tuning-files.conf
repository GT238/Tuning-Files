# nginx config for the Tuning Files Archive
# install: /etc/nginx/sites-available/tuning-files  (+ symlink in sites-enabled)
# serves the static catalog at /, proxies /submit + /review to the Flask app,
# and blocks public access to the unreviewed submission inbox.

server {
    listen 80 default_server;
    server_name _;   # replace with your domain when you get one

    client_max_body_size 64m;   # submission uploads

    root /srv/tuning-files/catalog;
    index index.html;

    # submission + review app (Flask on localhost:5000)
    location /submit {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /review {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # unreviewed submissions must NEVER be publicly downloadable
    location /files/_inbox/ {
        return 403;
    }

    # the archive itself. Unknown extensions (.bin) download rather than
    # render; .xdf is served as XML so it can be inspected in a browser.
    location /files/ {
        alias /srv/tuning-files/files/;
        default_type application/octet-stream;
        types { application/xml xdf; }
        # handy fallback directory listing; comment out if you prefer it hidden
        autoindex on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
