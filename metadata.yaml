# Metadata for the tuning file archive.
#
# One entry per file under files/. The "path" must match the file's location
# relative to files/, using forward slashes. The build script fills in
# size, sha256 and modified automatically -- do not add those here.
#
# Fields:
#   path          (required) location under files/, e.g. GM/E38/12600587/stock/12600587.bin
#   type          stock | tune | xdf | tool | doc | other
#   manufacturer  GM, Ford, Chrysler, Dodge, Honda, ...
#   ecu           ECU family, e.g. E38, E67, Car-LS, Car-V6, Duramax-LLY, TCM, Unverified
#   module        PCM | ECM | TCM -- which module the file belongs to
#   os_id         operating-system / flash ID of the calibration
#   cal_id        calibration ID
#   vehicle       e.g. "Chevrolet Silverado 1500"
#   engine        e.g. "6.0L LQ4 V8"
#   years         "2007-2013"
#   transmission  optional, e.g. "4L65E/4L70E"
#   description   short human notes
#   source        where the file came from (own scan, forum user, ... )
#   source_url    optional link
#   xdf           path (relative to files/) of a compatible XDF definition
#   tags          free-form keywords
#   verified      true if the checksum was confirmed against a known-good copy
#   notes         anything else
#
# The build script warns about: files with no entry, entries with no file,
# bad type values, xdf references pointing at missing files, claimed OS/CAL
# IDs that are NOT embedded in the bin (mislabeled filename), and
# byte-identical duplicate files (duplicate_of is set automatically).
#
# --- 2004/2005 GM import (36 bins from the owner's collection) ---
# Conventions for this batch: os_id = the ID embedded in the bin when present
# (filename claim otherwise, flagged with an "ID?" badge on the site);
# cal_id = the other embedded 8-digit number where OS/CAL is ambiguous;
# files with odd sizes or unverifiable identity live under Unverified/.

